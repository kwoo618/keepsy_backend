services:
  engine:
    build: .
    container_name: keepsy-engine
    ports:
      - "127.0.0.1:8000:8000"   # 외부 노출은 호스트의 Caddy가 담당
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - AS_OF_OVERRIDE=${AS_OF_OVERRIDE:-}
    restart: unless-stopped
